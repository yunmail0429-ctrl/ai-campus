services:
  storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    env_file: ./deploy/storage.env
    volumes: [objects:/data]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", http://127.0.0.1:9000/minio/health/ready]
      interval: 15s
      timeout: 5s
      retries: 3
