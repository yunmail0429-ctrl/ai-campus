<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导航方案预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#173252;font:14px Arial,"Microsoft YaHei",sans-serif}.stage{height:100vh}.shell{display:flex;height:100%;background:#f8fafc}.side{width:250px;padding:28px 18px;background:#102945;color:#dbe7f7;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;margin-bottom:36px}.logo{width:38px;height:38px;border-radius:12px;background:#4c88ca;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}.brand b,.brand small{display:block}.brand b{color:#fff}.brand small{font-size:11px;color:#9bb0c7;margin-top:4px}.group{margin:0 8px 22px}.group h5{margin:0 0 8px;color:#6f8aa8;font-size:10px;letter-spacing:.12em}.nav{padding:11px 12px;border-radius:9px;color:#a9bbcf;display:block;margin:3px 0}.nav.active{background:#23517e;color:#fff;box-shadow:inset 3px 0 #8cc2f1}.bottom{margin-top:auto;color:#9db1c6}.main{flex:1;padding:46px 52px}.main h1{margin:0 0 10px;font-size:30px}.main p{color:#7c8da1}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px}.card{height:120px;background:#fff;border:1px solid #e0e8f1;border-radius:14px;padding:18px}.card b{display:block;margin:22px 0 6px}.card small{color:#8898aa}.rail{width:76px;background:#102945;color:#adc0d5;padding:22px 12px;display:flex;flex-direction:column;align-items:center;gap:18px}.rail .logo{margin-bottom:18px}.rail .rnav{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:19px}.rail .rnav.active{background:#2c6194;color:#fff}.top{height:74px;padding:0 34px;display:flex;align-items:center;gap:34px;background:#fff;border-bottom:1px solid #e3eaf1}.top .brand{margin:0 auto 0 0}.top .nav{color:#64778d;margin:0}.top .nav.active{color:#235d94;background:#edf5fd}.dual{display:flex;height:100%}.dual .side{width:205px}.dual .main{background:#fff}.admin-switch{margin-top:auto;padding:12px;background:#193b61;border-radius:10px;color:#b8cbe0}.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.24);font:13px Arial}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12)}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}
</style></head><body><main id="stage" class="stage"></main><nav class="proto-picker"><span class="proto-picker-highlight"></span><button class="proto-picker-item" data-active aria-current="true">分组工作台</button><button class="proto-picker-item">折叠导航</button><button class="proto-picker-item">顶部主导航</button><button class="proto-picker-item">双层导航</button></nav><script>
const variants=[()=>`<div class="shell"><aside class="side"><div class="brand"><span class="logo">智</span><div><b>西附两江</b><small>智能教育助手</small></div></div><div class="group"><h5>工作空间</h5><a class="nav active">⌂　AI 工作台</a><a class="nav">✦　AI 助手</a><a class="nav">▣　我的资源</a></div><div class="group"><h5>教学能力</h5><a class="nav">⌁　命题审题</a><a class="nav">▤　教案生成</a><a class="nav">▥　PPT 课件</a><a class="nav">✧　AI 创作中心</a></div><div class="group"><h5>知识与经验</h5><a class="nav">◇　Skill 中心</a><a class="nav">▦　我的知识库</a></div><div class="bottom">本月积分　8,420 / 10,000</div></aside><section class="main"><h1>下午好，李老师</h1><p>今天也让 AI 帮你把时间还给教学。</p><div class="cards"><div class="card"><b>命题审题</b><small>试题生成与质量检查</small></div><div class="card"><b>智能教案</b><small>从目标到完整教学设计</small></div><div class="card"><b>AI 创作中心</b><small>图片、PPT、视频与 3D</small></div></div></section></div>`,()=>`<div class="shell"><aside class="rail"><span class="logo">智</span><span class="rnav active">⌂</span><span class="rnav">✦</span><span class="rnav">◇</span><span class="rnav">▣</span><span class="rnav">⚙</span></aside><section class="main"><h1>下午好，李老师</h1><p>悬停左侧图标可展开完整导航。</p><div class="cards"><div class="card"><b>AI 工作台</b><small>快速进入常用教学能力</small></div><div class="card"><b>最近任务</b><small>查看生成中的资源</small></div><div class="card"><b>常用 Skill</b><small>复用你的教学经验</small></div></div></section></div>`,()=>`<div class="shell" style="display:block"><header class="top"><div class="brand"><span class="logo">智</span><div><b>西附两江</b><small>智能教育助手</small></div></div><a class="nav active">AI 工作台</a><a class="nav">AI 助手</a><a class="nav">Skill 中心</a><a class="nav">AI 创作中心</a><span>李老师 ▾</span></header><section class="main"><h1>下午好，李老师</h1><p>顶部承载一级模块，页面内容获得更大宽度。</p><div class="cards"><div class="card"><b>命题审题</b><small>试题生成与质量检查</small></div><div class="card"><b>智能教案</b><small>从目标到完整教学设计</small></div><div class="card"><b>多模态创作</b><small>图片、视频、音乐与 3D</small></div></div></section></div>`,()=>`<div class="dual"><aside class="side"><div class="brand"><span class="logo">智</span><div><b>西附两江</b><small>教师工作台</small></div></div><a class="nav active">⌂　AI 工作台</a><a class="nav">✦　AI 助手</a><a class="nav">◇　Skill 中心</a><a class="nav">▣　AI 创作中心</a><div class="admin-switch">切换到管理员后台<br><small>账号与知识库管理 →</small></div></aside><section class="main"><h1>教师工作台</h1><p>教师端保持轻量，管理员端使用独立的密集导航。</p><div class="cards"><div class="card"><b>教师模式</b><small>只显示教学相关入口</small></div><div class="card"><b>管理员后台</b><small>账号、知识库、模型与积分</small></div><div class="card"><b>权限边界</b><small>通过身份切换进入治理功能</small></div></div></section></div>`];
const stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight'),items=[...picker.querySelectorAll('.proto-picker-item')];let current=0;function move(){const e=items[current];highlight.style.width=e.offsetWidth+'px';highlight.style.transform=`translateX(${e.offsetLeft}px)`}function mount(i){stage.innerHTML=variants[i]()}function set(i){current=i;items.forEach((e,j)=>{e.toggleAttribute('data-active',j===i);j===i?e.setAttribute('aria-current','true'):e.removeAttribute('aria-current')});move();mount(i)}items.forEach((e,i)=>e.onclick=()=>set(i));window.onresize=move;set(0);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script></body></html>
