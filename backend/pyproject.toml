[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xflj-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3", "argon2-cffi>=23.1,<26", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "boto3>=1.35,<2", "celery[redis]>=5.5,<6",
  "pypdf>=6,<7", "python-docx>=1.1,<2", "python-pptx>=1,<2", "beautifulsoup4>=4.13,<5",
  "pgvector>=0.4,<1", "reportlab>=4.4,<5", "markdown-it-py>=3,<5", "Pillow>=12,<13",
  "cryptography>=44,<51"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "moto[s3]>=5,<6", "fonttools>=4,<5"]
[project.scripts]
xflj = "app.cli:main"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/fonts/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py312"
