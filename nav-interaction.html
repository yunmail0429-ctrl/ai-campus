<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导航交互演示</title><style>
:root{--nav:#294b6c;--accent:#a9d5f2;--bg:#e9f0f6;--ink:#173252;--muted:#7b8da3;--ease:cubic-bezier(.22,1,.36,1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Noto Sans SC","Microsoft YaHei",sans-serif;overflow:hidden}.demo{height:100vh;display:flex;padding:14px;gap:14px}.sidebar{width:82px;height:calc(100vh - 28px);background:linear-gradient(160deg,#355d80,#294b6c);border-radius:22px;color:#dfeaf6;box-shadow:0 18px 40px rgba(50,86,116,.18),inset 0 1px rgba(255,255,255,.07);padding:22px 12px;position:relative;z-index:2;transition:width .32s var(--ease),box-shadow .32s var(--ease)}.sidebar[data-open="true"]{width:252px;box-shadow:0 22px 48px rgba(50,86,116,.24),inset 0 1px rgba(255,255,255,.1)}.brand{height:42px;display:flex;align-items:center;gap:11px;white-space:nowrap}.logo{width:38px;height:38px;flex:none;border-radius:12px;background:#4c8dcc;color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px}.brand-copy,.label,.group-title,.profile-copy,.credit-copy{opacity:0;transform:translateX(-6px);pointer-events:none;transition:opacity .18s ease .04s,transform .32s var(--ease)}.sidebar[data-open="true"] .brand-copy,.sidebar[data-open="true"] .label,.sidebar[data-open="true"] .group-title,.sidebar[data-open="true"] .profile-copy,.sidebar[data-open="true"] .credit-copy{opacity:1;transform:none;pointer-events:auto}.brand-copy b,.brand-copy small,.profile-copy b,.profile-copy small,.credit-copy b,.credit-copy small{display:block}.brand-copy b{color:#fff;font-size:14px}.brand-copy small{font-size:10px;color:#98b1ca;margin-top:4px}.nav{margin-top:34px}.group-title{display:block;color:#7896b4;font-size:10px;letter-spacing:.14em;margin:0 10px 9px;white-space:nowrap}.item{height:44px;margin:4px 0;border:0;background:transparent;color:#a9bed3;width:100%;border-radius:11px;display:flex;align-items:center;gap:13px;padding:0 12px;text-align:left;cursor:pointer;position:relative;font:inherit;white-space:nowrap}.item:hover{color:#fff;background:rgba(255,255,255,.07)}.item.active{color:#fff;background:rgba(91,157,213,.25)}.item.active:before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:4px;background:var(--accent);box-shadow:0 0 14px rgba(142,199,245,.8)}.icon{font-size:18px;width:21px;flex:none;text-align:center;color:#9dbbd7}.item.active .icon{color:#d7efff}.credit{position:absolute;left:12px;right:12px;bottom:70px;padding:12px;border-radius:12px;background:rgba(255,255,255,.07);white-space:nowrap;overflow:hidden}.credit-copy small{color:#9db5cd;font-size:10px}.credit-copy b{color:#fff;font-size:16px;margin-top:5px}.credit-bar{height:4px;border-radius:9px;background:#315676;margin-top:10px}.credit-bar i{display:block;width:84%;height:100%;border-radius:9px;background:#80bee9}.profile{position:absolute;left:12px;right:12px;bottom:18px;display:flex;align-items:center;gap:9px;padding:8px;border-radius:11px;background:rgba(0,0,0,.12);white-space:nowrap}.avatar{width:29px;height:29px;border-radius:50%;background:#d9eafd;color:#2e5fa3;display:grid;place-items:center;font-weight:800;flex:none}.profile-copy b{font-size:11px;color:#fff}.profile-copy small{font-size:10px;color:#9db5cd;margin-top:3px}.main{flex:1;background:#f3f7fa;border-radius:22px;overflow:hidden;padding:44px 54px;position:relative}.main:before{content:"";position:absolute;right:8%;top:-180px;width:440px;height:440px;border-radius:50%;background:#dceaf4;opacity:.7}.topline,.content{position:relative;z-index:1}.topline{display:flex;justify-content:space-between;align-items:start}.eyebrow{color:#7c94ac;font-size:10px;letter-spacing:.15em}.topline h1{font-size:29px;margin:8px 0 7px}.topline p{color:var(--muted);margin:0}.hint{padding:10px 13px;border-radius:9px;background:#eaf3fb;color:#5684af;font-size:12px}.hero{margin-top:44px;max-width:770px}.hero h2{font-size:28px;line-height:1.35;margin:0 0 12px}.hero h2 span{color:#3678b9}.hero p{color:var(--muted);line-height:1.7}.actions{display:flex;gap:13px;margin-top:24px}.action{border:0;border-radius:9px;padding:12px 18px;background:#2e5fa3;color:#fff;font-weight:700;cursor:pointer}.action.ghost{background:#fff;color:#4b7399;border:1px solid #d7e4ef}.signal{position:absolute;right:12%;bottom:16%;width:150px;height:150px;border:1px solid #bfd8ed;border-radius:50%}.signal:before,.signal:after{content:"";position:absolute;border:1px solid #cfe3f3;border-radius:50%;inset:22px}.signal:after{inset:47px;background:#fff;box-shadow:0 8px 24px #cbddea}.motion-note{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:#315674;color:#cfe2f4;font-size:12px;box-shadow:0 10px 25px rgba(17,44,74,.2)}@media(max-width:720px){body{overflow:auto}.demo{padding:9px}.sidebar{position:fixed;left:9px;top:9px;height:calc(100vh - 18px)}.main{padding:34px 24px 34px 104px}.sidebar[data-open="true"]~.main{filter:brightness(.92)}.hint{display:none}.signal{display:none}}
</style>'<style>

+</style>'</head><body><div class="demo"><aside class="sidebar" id="sidebar" tabindex="0" aria-label="教师导航"><div class="brand"><span class="logo">智</span><div class="brand-copy"><b>西附两江</b><small>智能教育助手</small></div></div><nav class="nav"><span class="group-title">工作空间</span><button class="item active" data-title="AI 工作台"><span class="icon">⌂</span><span class="label">AI 工作台</span></button><button class="item" data-title="AI 助手"><span class="icon">✦</span><span class="label">AI 助手</span></button><button class="item" data-title="Skill 中心"><span class="icon">◇</span><span class="label">Skill 中心</span></button><button class="item" data-title="AI 创作中心"><span class="icon">▣</span><span class="label">AI 创作中心</span></button></nav><div class="credit"><div class="credit-copy"><small>本月积分</small><b>8,420 / 10,000</b><div class="credit-bar"><i></i></div></div></div><div class="profile"><span class="avatar">李</span><div class="profile-copy"><b>李老师</b><small>高中语文 · 教师</small></div></div></aside><main class="main"><div class="topline"><div><span class="eyebrow">TEACHER WORKSPACE</span><h1 id="pageTitle">AI 工作台</h1><p id="pageDesc">把时间还给教学，把重复工作交给 AI。</p></div><span class="hint">移入左侧 · 体验展开</span></div><section class="content hero"><h2>从一个想法开始，<span>快速生成教学资源</span></h2><p>导航会延迟展开，活动状态会平滑移动，右侧内容会根据当前入口同步更新。</p><div class="actions"><button class="action">开始 AI 对话</button><button class="action ghost">查看最近任务</button></div></section><div class="signal"></div></main></div><div class="motion-note" id="note">导航交互演示 · 鼠标移入左侧</div><script>
const sidebar=document.getElementById('sidebar'),items=[...document.querySelectorAll('.item')],title=document.getElementById('pageTitle'),desc=document.getElementById('pageDesc'),note=document.getElementById('note');let openTimer,closeTimer;sidebar.addEventListener('mouseenter',()=>{clearTimeout(closeTimer);openTimer=setTimeout(()=>sidebar.dataset.open='true',120)});sidebar.addEventListener('mouseleave',()=>{clearTimeout(openTimer);closeTimer=setTimeout(()=>{if(document.activeElement!==sidebar)sidebar.dataset.open='false'},180)});sidebar.addEventListener('focusin',()=>sidebar.dataset.open='true');sidebar.addEventListener('focusout',e=>{if(!sidebar.contains(e.relatedTarget))sidebar.dataset.open='false'});items.forEach(item=>item.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));item.classList.add('active');title.textContent=item.dataset.title;desc.textContent={"AI 工作台":"把时间还给教学，把重复工作交给 AI。","AI 助手":"在对话、工作区和知识库之间顺畅切换。","Skill 中心":"复用学校经验，也沉淀你的个人 Skill。","AI 创作中心":"图片、PPT、视频、音乐与 3D 一站式创作。"}[item.dataset.title];note.textContent=item.dataset.title+' · 活动状态已切换'}));document.addEventListener('keydown',e=>{if(e.key==='Escape')sidebar.dataset.open='false'});
</script></body></html>
