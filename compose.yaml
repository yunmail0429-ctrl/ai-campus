services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: xflj
      POSTGRES_USER: xflj
      POSTGRES_PASSWORD: ${XFLJ_DB_PASSWORD:?Set XFLJ_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:${XFLJ_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xflj -d xflj"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
