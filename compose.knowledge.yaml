services:
  object-store:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${XFLJ_STORAGE_USER:?Set XFLJ_STORAGE_USER}
      MINIO_ROOT_PASSWORD: ${XFLJ_STORAGE_PASSWORD:?Set XFLJ_STORAGE_PASSWORD}
    ports:
      - "127.0.0.1:${XFLJ_STORAGE_PORT:-59000}:9000"
      - "127.0.0.1:${XFLJ_STORAGE_CONSOLE_PORT:-59001}:9001"
    volumes:
      - knowledge-objects:/data
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    environment:
      XFLJ_REDIS_PASSWORD: ${XFLJ_REDIS_PASSWORD:?Set XFLJ_REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$XFLJ_REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${XFLJ_REDIS_PORT:-56379}:6379"
    volumes:
      - knowledge-redis:/data
    restart: unless-stopped
  antivirus:
    image: clamav/clamav:stable
    ports:
      - "127.0.0.1:${XFLJ_CLAMAV_PORT:-53310}:3310"
    volumes:
      - knowledge-virus-definitions:/var/lib/clamav
    restart: unless-stopped
volumes:
  knowledge-objects:
  knowledge-redis:
  knowledge-virus-definitions:
