<style>
:root{
  --blue:#2E5FA3;
  --blue-deep:#23497F;
  --blue-soft:#EAF1FA;
  --ink:#1B2A41;
  --muted:#556278;
  --hair:#DCE3EE;
  --field:#F4F7FB;
  --success:#279e68;
  --warn:#e6a23c;
  --danger:#dd5252;
  --shadow: 0 2px 10px rgba(0,0,0,0.06);
  --radius:12px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;background:#0d233f;
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ========== 登录态背景：校园深色 ========== */
.login-bg{
  position:fixed;inset:0;z-index:1;
  background:url("assets/campus-login.jpg") center/cover no-repeat,#0d233f;
  transition:opacity .7s var(--ease), background-color .7s var(--ease);
}
.login-bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to right,
    rgba(13,35,66,.84) 0%,
    rgba(13,35,66,.64) 28%,
    rgba(255,255,255,.05) 52%,
    rgba(255,255,255,.96) 74%,
    #ffffff 82%);
}
.bg-anim{animation:bgZoom 5.2s var(--ease) forwards}

/* 登录态整体舞台 */
.login-stage{
  position:relative;z-index:2;display:grid;grid-template-columns:52% 48%;height:100vh;
  transition:opacity .7s var(--ease), transform .7s var(--ease);
}
.light-sweep{
  position:fixed;top:0;left:-20%;width:40%;height:100%;z-index:4;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.16),rgba(255,255,255,0));
  transform:translateX(0);opacity:0;
  animation:sweep 2.2s var(--ease) .35s forwards;
}

/* 登录页左侧 */
.left{display:flex;flex-direction:column;justify-content:center;padding:0 clamp(28px,5vw,72px);color:#fff}
.badge{display:inline-flex;align-items:center;gap:.7rem;margin-bottom:2rem}
.badge .ring{
  width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);
  display:grid;place-items:center;background:rgba(255,255,255,.1);
}
.badge .ring.school-emblem{border:0;background:transparent;overflow:hidden;width:58px;height:58px}.badge .ring.school-emblem img{width:100%;height:100%;object-fit:contain;display:block}
.badge .sch{font-size:1.05rem;font-weight:700;letter-spacing:.12em;line-height:1.4}
.badge .sub{font-size:.8rem;opacity:.75;letter-spacing:.06em}
.left h1{
  font-family:"Noto Serif SC",serif;font-weight:900;
  font-size:clamp(1.9rem,4vw,2.9rem);line-height:1.25;margin-bottom:2.2rem;
  text-shadow:0 2px 14px rgba(0,0,0,.3);
}
.motto{display:flex;flex-direction:column;gap:1.2rem}
.motto .row{display:flex;align-items:baseline;gap:1rem}
.motto .k{font-size:.9rem;letter-spacing:.3em;opacity:.85;flex:none;width:3.2em}
.motto .v{font-family:"Noto Serif SC",serif;font-weight:700;font-size:clamp(1.3rem,2.2vw,1.7rem);letter-spacing:.18em;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.left .slogan{margin-top:2.6rem;font-size:1rem;line-height:1.9;max-width:24em;border-top:1px solid rgba(255,255,255,.28);padding-top:1.4rem}

/* 登录页右侧 */
.right{display:flex;align-items:center;justify-content:center;padding:32px 44px}
.login{width:100%;max-width:420px}
.login-head{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:1.6rem}
.login-head .logo{
  width:56px;height:56px;border-radius:16px;background:var(--blue);color:#fff;
  display:grid;place-items:center;margin-bottom:.9rem;
  box-shadow:0 10px 24px -10px rgba(46,95,163,.5);
}
.login-head .logo{width:180px;height:auto;border-radius:0;background:transparent;box-shadow:none;margin-bottom:1rem}.login-head .logo img{display:block;width:100%;height:auto;object-fit:contain}
.login-head h2{font-size:1.5rem;font-weight:700;color:var(--ink)}
.login-head p{font-size:.95rem;color:var(--muted);margin-top:.3rem}
.tag-row{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center;margin-bottom:1.6rem}
.tag-row span{
  font-size:.88rem;color:var(--blue);background:var(--blue-soft);
  border:1px solid rgba(46,95,163,.16);padding:.35rem .9rem;border-radius:999px;
}
.field{margin-bottom:1.05rem}
.field label{display:block;font-size:.95rem;color:#44526B;margin-bottom:.45rem;font-weight:500}
.field .box{
  display:flex;align-items:center;gap:.6rem;
  background:var(--field);border:1px solid var(--hair);border-radius:12px;
  padding:0 14px;height:52px;transition:border-color .2s,box-shadow .2s,background .2s;
}
.field .box .ic{color:#93A1B8;flex:none;display:grid;place-items:center}
.field .box input{flex:1;border:0;background:transparent;height:100%;outline:none;font-size:1rem;color:var(--ink);min-width:0}
.field .box input::placeholder{color:#A9B4C6}
.field .box:focus-within{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(46,95,163,.12)}
.field .box .eye{background:none;border:0;cursor:pointer;color:#93A1B8;display:grid;place-items:center;padding:.2rem}
.field .box .eye:hover{color:var(--blue)}
.row-opt{display:flex;align-items:center;justify-content:space-between;margin:.7rem 0 1.3rem;font-size:.92rem;color:#44526B}
.row-opt label{display:flex;align-items:center;gap:.45rem;cursor:pointer}
.row-opt input{accent-color:var(--blue);width:15px;height:15px}
.row-opt a{color:var(--blue);font-weight:500}
.row-opt a:hover{color:var(--blue-deep)}
.btn-login{
  width:100%;height:54px;border:0;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--blue-deep));
  color:#fff;font-size:1.05rem;font-weight:700;letter-spacing:.08em;
  transition:transform .15s,box-shadow .2s,opacity .2s;
}
.btn-login:hover{box-shadow:0 14px 28px -14px rgba(46,95,163,.65);transform:translateY(-1px)}
.btn-login:active{transform:none}
.btn-login:disabled{opacity:0.75;cursor:not-allowed;transform:none;box-shadow:none}
.login-foot{margin-top:1.2rem;text-align:center;font-size:.88rem;color:#98A3B8;line-height:1.7}

@keyframes spin{to{transform:rotate(360deg)}}
.btn-login.loading{display:flex;align-items:center;justify-content:center;gap:8px}
.btn-login.loading::before{
  content:"";width:16px;height:16px;border:2px solid #ffffff44;border-top-color:#fff;
  border-radius:50%;animation:spin .8s linear infinite;
}

/* ========== 登录态退场动画 ========== */
@keyframes loginStageOut{
  from{opacity:1;transform:translateY(0)}
  to{opacity:0;transform:translateY(-30px)}
}
@keyframes loginBgOut{from{opacity:1}to{opacity:0}}
.login-stage.is-leaving{animation:loginStageOut .7s var(--ease) forwards}
.login-bg.is-leaving{animation:loginBgOut .7s var(--ease) forwards}

/* ========== 登录成功后的空白工作台容器（保留进入/退出动画，删除所有admin、教师页面内容） ========== */
.workbench-layer{
  position:fixed;inset:0;z-index:3;
  background:#f6f8fc;overflow:hidden;
  opacity:0;visibility:hidden;transform:translateY(24px);
  transition:opacity .7s var(--ease), visibility .7s var(--ease), transform .7s var(--ease);
}
.workbench-layer.is-entering{opacity:1;visibility:visible;transform:translateY(0)}

/* ========== 动画定义 ========== */
@keyframes bgZoom{
  0%{transform:scale(1.09);filter:brightness(.72)}
  100%{transform:scale(1);filter:brightness(1)}
}
@keyframes sweep{
  0%{opacity:0;transform:translateX(0)}
  40%{opacity:1}
  100%{opacity:0;transform:translateX(420%)}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:none}
}
@keyframes formIn{
  from{opacity:0;transform:translateY(34px) scale(.985)}
  to{opacity:1;transform:none}
}
@keyframes btnIn{
  from{opacity:0;transform:scale(.94)}
  to{opacity:1;transform:scale(1)}
}
@keyframes breath{
  0%,100%{box-shadow:0 0 0 0 rgba(46,95,163,.45)}
  50%{box-shadow:0 0 0 12px rgba(46,95,163,0)}
}
.enter{opacity:0;animation:fadeUp .8s var(--ease) forwards}
.enter.d1{animation-delay:.5s}
.enter.d2{animation-delay:.72s}
.enter.d3{animation-delay:.95s}
.enter.d4{animation-delay:1.18s}
.enter.d5{animation-delay:1.4s}
.enter.d6{animation-delay:1.62s}
.form-card{opacity:0;animation:formIn .9s var(--ease) .55s forwards}
.btn-anim{opacity:0;animation:btnIn .7s var(--ease) 1.85s forwards}
.btn-anim::after{content:"";animation:breath 2.6s var(--ease) 2.5s infinite}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .login-bg{opacity:1}
  .login-stage{opacity:1;transform:none}
  .workbench-layer{opacity:1;visibility:visible;transform:none}
  .light-sweep{display:none}
}

  .login-stage{grid-template-columns:1fr;height:auto;min-height:100vh}
  .left{padding:56px 26px 40px}
  .right{padding:24px 22px 56px}
  .login-head .logo{display:none}
}

<script>
(function(){
  var form=document.getElementById('loginForm');
  const navToggle=document.getElementById('navToggle');
  const workspaceNav=document.getElementById('workspaceNav');
  navToggle.addEventListener('click',function(){
    const collapsed=workspaceNav.classList.toggle('is-collapsed');
    navToggle.setAttribute('aria-expanded',String(!collapsed));
    navToggle.setAttribute('aria-label',collapsed?'展开导航':'收起导航');
    navToggle.title=collapsed?'展开导航':'收起导航';
  });

  const accountButton=document.getElementById('accountButton');
  const accountPopover=document.getElementById('accountPopover');
  function closeAccount(){accountPopover.hidden=true;accountButton.setAttribute('aria-expanded','false');}
  accountButton.addEventListener('click',()=>{accountPopover.hidden=!accountPopover.hidden;accountButton.setAttribute('aria-expanded',String(!accountPopover.hidden));});
  document.addEventListener('click',e=>{if(!accountButton.contains(e.target)&&!accountPopover.contains(e.target))closeAccount();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!accountPopover.hidden){closeAccount();accountButton.focus();}});

  var toastEl;
  var loginStage=document.getElementById('loginStage');
  var loginBg=document.getElementById('loginBg');
  var workbenchLayer=document.getElementById('workbenchLayer');
  var loginBtn=document.getElementById('loginBtn');

  function toast(msg){
    if(!toastEl){
      toastEl=document.createElement('div');
      toastEl.style.cssText='position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#23497F;color:#fff;padding:.8rem 1.4rem;border-radius:10px;font-size:.9rem;box-shadow:0 12px 30px -12px rgba(35,73,127,.6);z-index:400;opacity:0;transition:opacity .3s;max-width:86vw;text-align:center';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent=msg;
    toastEl.style.opacity=1;
    clearTimeout(toastEl._t);
    toastEl._t=setTimeout(function(){toastEl.style.opacity=0;},2400);
  }

  // 退出登录
  function logout(){
    closeAccount();
    workbenchLayer.classList.remove('is-entering');
    setTimeout(()=>{
      loginStage.classList.remove('is-leaving');
      loginBg.classList.remove('is-leaving');
    },300);
    toast("已退出登录");
  }

  // 表单提交登录
  form.onsubmit = function(e){
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    loginBtn.classList.add('loading');
    loginBtn.disabled = true;

    setTimeout(()=>{
      if(username !== 'teacher'){
        toast('账号错误，请输入 teacher');
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
        return;
      }
      // 登录退场动画
      loginStage.classList.add('is-leaving');
      loginBg.classList.add('is-leaving');
      setTimeout(()=>{
        workbenchLayer.classList.add('is-entering');
        document.getElementById('logoutBtn').onclick = logout;
      },700);
      loginBtn.classList.remove('loading');
      loginBtn.disabled = false;
    },1000)
  }

  // 密码显隐切换
  const eyeBtn = document.getElementById('eye');
  const passwordInput = document.getElementById('password');
  const eyeOpen = document.getElementById('eyeOpen');
  const eyeClose = document.getElementById('eyeClose');
  eyeBtn.onclick = function(){
    if(passwordInput.type==='password'){
      passwordInput.type='text';
      eyeOpen.style.display='none';
      eyeClose.style.display='block';
    }else{
      passwordInput.type='password';
      eyeOpen.style.display='block';
      eyeClose.style.display='none';
    }
  }
})();
</script>
